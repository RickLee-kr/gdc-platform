id: cybereason
name: Cybereason EDR
vendor: Cybereason
product: Malop API
version: "1.0.0"
source_type: HTTP_API_POLLING

auth:
  type: vendor_jwt_exchange
  schema_ref: auth_schema.json
  lab_supported: true

streams:
  - id: malop
    name: Malop Search
    template: streams/malop.yaml
    default_mapping: mappings/malop.json
    default_enrichment: enrichments/malop.json
  - id: hunting
    name: Hunting Search
    template: streams/hunting.yaml
    default_mapping: mappings/hunting.json
    default_enrichment: enrichments/hunting.json

capabilities:
  api_test: true
  incremental_polling: true
  json_preview: true
  multi_stream: true
  template_instantiate: true

documentation:
  docs_ref: docs.md
  category: EDR
  vendor_doc_url: "https://www.cybereason.com/"

tags: [edr, cybereason, malop, vendor_jwt]
