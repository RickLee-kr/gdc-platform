id: crowdstrike
name: CrowdStrike Falcon
vendor: CrowdStrike
product: Falcon
version: "1.0.0"
source_type: HTTP_API_POLLING

auth:
  type: bearer
  schema_ref: auth_schema.json
  lab_supported: true

streams:
  - id: detections
    name: Detections
    template: streams/detections.yaml
    default_mapping: mappings/detections.default.json
    default_enrichment: enrichments/detections.default.json
  - id: incidents
    name: Incidents
    template: streams/incidents.yaml
    default_mapping: mappings/incidents.default.json
    default_enrichment: enrichments/incidents.default.json

capabilities:
  api_test: true
  incremental_polling: true
  json_preview: true
  multi_stream: true
  template_instantiate: true

documentation:
  docs_ref: docs.md
  category: EDR
  vendor_doc_url: "https://falcon.crowdstrike.com/documentation"

tags: [edr, crowdstrike, falcon, bearer]
