# Default local compose mirrors docker-compose.platform.yml core services.
# Lab HTTP fixtures (WireMock / webhook echo / syslog) are behind profile `lab`
# (inherited from platform.yml). Start fixtures with:
#   docker compose --profile lab up -d
# Or use the platform file explicitly:
#   docker compose -f docker-compose.platform.yml --profile lab up -d
# See docs/operations/lab-resource-guardrails.md.
services:
  postgres:
    extends:
      file: docker-compose.platform.yml
      service: postgres

  api:
    extends:
      file: docker-compose.platform.yml
      service: api

  scheduler:
    extends:
      file: docker-compose.platform.yml
      service: scheduler

  gdc-wiremock-test:
    extends:
      file: docker-compose.platform.yml
      service: gdc-wiremock-test

  gdc-webhook-receiver-test:
    extends:
      file: docker-compose.platform.yml
      service: gdc-webhook-receiver-test

  gdc-syslog-test:
    extends:
      file: docker-compose.platform.yml
      service: gdc-syslog-test

  frontend:
    extends:
      file: docker-compose.platform.yml
      service: frontend

  reverse-proxy:
    extends:
      file: docker-compose.platform.yml
      service: reverse-proxy

volumes:
  gdc_platform_postgres_data:
  gdc_platform_tls:
  gdc_platform_nginx:
