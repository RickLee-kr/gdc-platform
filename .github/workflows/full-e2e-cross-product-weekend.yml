name: Full E2E Cross-Product Weekend

# Weekend full Cross-Product including all Fault/Recovery + Replay/Failover.
# Complements nightly (which also runs full product) with fresh lab reset emphasis.

on:
  schedule:
    - cron: "0 19 * * 0" # Sunday 04:00 KST
  workflow_dispatch:

concurrency:
  group: full-e2e-cross-product-weekend-${{ github.ref }}
  cancel-in-progress: false

jobs:
  weekend-full:
    uses: ./.github/workflows/full-e2e-cross-product-nightly.yml
    secrets: inherit
