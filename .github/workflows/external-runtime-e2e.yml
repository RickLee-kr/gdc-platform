name: External runtime E2E (optional)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "app/sources/**"
      - "app/runners/**"
      - "app/runtime/**"
      - "app/delivery/**"
      - "tests/test_external_runtime_e2e.py"
      - "tests/e2e_runtime_helpers.py"
      - "docker-compose.test.yml"
      - "scripts/test/run-external-runtime-e2e-tests.sh"
      - "scripts/testing/**"
      - "requirements.txt"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  external-runtime-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start fixture stack
        run: |
          chmod +x scripts/testing/*.sh scripts/test/*.sh
          ./scripts/testing/start-external-runtime-e2e-stack.sh
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run external runtime E2E
        env:
          TEST_DATABASE_URL: postgresql://gdc:gdc@127.0.0.1:55441/gdc_pytest
          DATABASE_URL: postgresql://gdc:gdc@127.0.0.1:55441/gdc_pytest
          WIREMOCK_BASE_URL: http://127.0.0.1:28080
          SOURCE_E2E_MINIO_ENDPOINT: http://127.0.0.1:59000
          SOURCE_E2E_PG_FIXTURE_URL: postgresql://gdc_fixture:gdc_fixture_pw@127.0.0.1:55433/gdc_query_fixture
          SOURCE_E2E_SFTP_HOST: "127.0.0.1"
          SOURCE_E2E_SFTP_PORT: "22222"
        run: |
          python3 scripts/test/ensure_gdc_pytest_catalog.py
          alembic upgrade head
          python3 -m pytest -m e2e_runtime tests/test_external_runtime_e2e.py -v --tb=short
      - name: Validate compose file
        run: docker compose -f docker-compose.test.yml config >/dev/null
